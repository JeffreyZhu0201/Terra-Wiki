# 正式环境：数据库 + 应用（应用启动时自动跑迁移）。开发/测试用的库在 docker-compose.dev.yml。
# 所有可配置项都在同目录 .env（参考 .env.example），compose 会自动读取。

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      # 注意：POSTGRES_PASSWORD 只在数据卷首次初始化时生效，
      # 改密码需要同时改 .env 并重建 pgdata 卷。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # 版本由 .env 的 APP_VERSION 决定（如 release-0.5.0），升级改它再 pull && up -d
    image: ghcr.io/jeffreyzhu0201/terra-wiki:${APP_VERSION:-release-0.5.0}
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-terra}:${POSTGRES_PASSWORD:-terra}@db:5432/${POSTGRES_DB:-terra}
      # 站点设置的初始值；后台设置页改过之后以数据库为准。
      SITE_NAME: ${SITE_NAME:-Terra-Wiki}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      RSS_TITLE: ${RSS_TITLE:-Terra-Wiki}
      SITE_KEYWORDS: ${SITE_KEYWORDS:-}
      SITE_FOOTER: ${SITE_FOOTER:-}
      UPLOAD_DIR: /app/uploads
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?请在 .env 里设置 BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 里设置 BOOTSTRAP_ADMIN_PASSWORD}
      VID_SALT: ${VID_SALT:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
