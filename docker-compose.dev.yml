# 本地开发/测试用的数据库，与正式环境（docker-compose.yml）完全分开。
# compose 会自动读取同目录 .env，连接串见其中的 DATABASE_URL / TEST_DATABASE_URL。
#
# 导入演示数据：
#   docker compose -f docker-compose.dev.yml exec -T db-dev \
#     psql -U terra -d terra -f /dev/stdin < scripts/seed.sql

services:
  # 开发库，next dev 通过 .env 的 DATABASE_URL（localhost:5432）连接
  db-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra}
      POSTGRES_DB: ${POSTGRES_DB:-terra}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 测试库，pnpm test 通过 .env 的 TEST_DATABASE_URL（localhost:55432）连接
  db-test:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terra}
      POSTGRES_DB: terra_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata-dev:
