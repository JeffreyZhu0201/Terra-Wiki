services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra
      POSTGRES_DB: terra_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra_test"]
      interval: 2s
      timeout: 3s
      retries: 30
